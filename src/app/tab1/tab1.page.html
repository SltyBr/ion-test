<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Заметки</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Заметки</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar
    placeholder="Поиск"
    [debounce]="250"
    [value]="search()"
    (ionInput)="onSearch($event)"
  ></ion-searchbar>

  @if (filtered().length) {
  <ion-list>
    @for (note of filtered(); track note.id) {
    <ion-item-sliding #sliding>
      <ion-item>
        <ion-label>
          <h2>{{ note.title }}</h2>
          <p>{{ note.createdAt | date: 'd MMM, HH:mm' }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="remove(note.id, sliding)">
          Удалить
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    }
  </ion-list>
  } @else {
  <div class="empty">
    {{ search() ? 'Ничего не найдено' : 'Заметок пока нет' }}
  </div>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openCreate()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

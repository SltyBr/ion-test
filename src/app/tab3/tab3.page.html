<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Настройки </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Настройки</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-item>
      <ion-label>Тёмная тема</ion-label>
      <ion-toggle
        (ionChange)="theme.toggle($event.detail.checked)"
        [checked]="theme.dark()"
        slot="end"
        aria-label="Тёмная тема"
      ></ion-toggle>
      <ion-icon slot="end" name="moon-outline"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
